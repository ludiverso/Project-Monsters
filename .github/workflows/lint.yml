name: Lint

on:
  pull_request:

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate PR commits
        run: |
          git log --reverse --no-merges --format='%H%x09%s' "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" |
          while IFS=$'\t' read -r sha subject; do
            if [ -z "$sha" ]; then
              continue
            fi

            echo "Validating $sha: $subject"
            dotnet run --file tools/commitlint.cs -- --message "$subject"
          done

  csharp-format:
    name: C# Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify formatting
        run: dotnet format ./Monsters.slnx --verify-no-changes
